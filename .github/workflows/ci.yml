name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Build-time only: every route here is dynamic (Server Components hitting
  # Supabase at request time), nothing is statically generated against a
  # real project, so a well-formed placeholder is enough to satisfy the
  # non-null assertions in lib/supabase/*.ts and get through `next build`.
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
  NEXT_PUBLIC_SITE_URL: "https://placeholder.example.com"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
