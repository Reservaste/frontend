name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Build-time only: every route here is dynamic (Server Components hitting
  # Supabase at request time), nothing is statically generated against a
  # real project, so a well-formed placeholder is enough to satisfy the
  # non-null assertions in lib/supabase/*.ts and get through `next build`.
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
  NEXT_PUBLIC_SITE_URL: "https://placeholder.example.com"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Real build (the real Supabase URL/anon key baked into the client
  # bundle, not the CI placeholders above), a Docker image pushed to
  # GHCR, and a deploy to the droplet -- no local machine involved.
  #
  # No approval gate here on purpose, unlike the backend's migrations: a
  # bad frontend deploy is a `docker compose up -d` away from being
  # undone by re-running the previous successful workflow, and NEXT_PUBLIC_*
  # values are not secrets -- they already ship to every visitor's browser
  # today. A schema change on real payment and credit rows is not in the
  # same class of mistake, which is why that gate exists on the backend
  # side and not here.
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # Same build the Dockerfile.prebuilt image has always shipped:
      # standalone output built here, copied verbatim into the image next.
      - run: npx next build

      # The runner's default `docker` driver can push an image fine but
      # can't export a build cache at all (GHA cache export needs the
      # `docker-container` driver) -- without this, cache-to below fails
      # the whole build, not just the caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          push: true
          tags: |
            ghcr.io/reservaste/frontend:latest
            ghcr.io/reservaste/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the deploy key into an SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Trust the droplet's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      # The org disables making a GHCR package public, so the droplet
      # can't just `docker pull` anonymously -- and storing a long-lived
      # registry token ON the droplet to work around that would be worse,
      # not better. Instead: point the Docker CLI at the droplet's remote
      # daemon over the same SSH key, log in to GHCR *locally* on the
      # runner (this ephemeral GITHUB_TOKEN, already used to push above),
      # and pull. Docker resolves registry auth from the machine running
      # the CLI even when the pull executes on a remote daemon, so the
      # image bytes flow straight from GHCR to the droplet and no
      # credential of any kind ends up stored there.
      - name: Point Docker at the droplet's remote daemon
        run: docker context create droplet --docker "host=ssh://root@${{ secrets.DROPLET_HOST }}"

      - name: Pull the new image onto the droplet
        run: |
          docker --context droplet login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          docker --context droplet pull ghcr.io/reservaste/frontend:latest
          docker --context droplet tag ghcr.io/reservaste/frontend:latest reservaste-app:latest

      # Only the orchestration runs over a plain ssh call from here: no
      # image bytes cross this connection, just "start the container you
      # already have" and the same health-check loop used by hand all
      # session.
      - name: Restart the app and wait for it to come up healthy
        run: |
          ssh root@${{ secrets.DROPLET_HOST }} '
            set -e
            cd /srv/reservaste/deploy
            docker compose up -d
            for i in 1 2 3 4 5 6 7 8; do
              status=$(docker inspect -f "{{.State.Health.Status}}" deploy-app-1 2>/dev/null || echo starting)
              echo "intento $i: $status"
              [ "$status" = "healthy" ] && exit 0
              sleep 5
            done
            echo "El contenedor no llego a healthy a tiempo -- revisar logs en el droplet"
            exit 1
          '

  # ADR-0039: a Playwright smoke suite against the real, already-deployed
  # site -- not a merge gate. `needs: deploy` alone, no `if` guarding it
  # against `deploy`'s own result: the deploy already happened by the time
  # this runs (its healthcheck loop above already waited for the container
  # to come up), so a red smoke-e2e never blocks or undoes anything that
  # already shipped. It exists to be *visible*, not to gate.
  #
  # `frontend/e2e/helpers.ts` documents the organization (`redentor`) this
  # operates and the "find or create, always clean up" rule every spec
  # follows -- read it before touching a spec here.
  smoke-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    # Read-only token: nothing in this job writes to the repo or registry.
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: "https://161-35-63-60.sslip.io"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # QA credentials scoped to this single step only (docs/security.md,
      # "Suite E2E contra produccion"): never at job level, where every
      # `npm ci` install script and `apt` hook above would also see them.
      - run: npx playwright test --config=e2e/playwright.config.ts
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
