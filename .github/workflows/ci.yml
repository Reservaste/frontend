name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Build-time only: every route here is dynamic (Server Components hitting
  # Supabase at request time), nothing is statically generated against a
  # real project, so a well-formed placeholder is enough to satisfy the
  # non-null assertions in lib/supabase/*.ts and get through `next build`.
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
  NEXT_PUBLIC_SITE_URL: "https://placeholder.example.com"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Real build (the real Supabase URL/anon key baked into the client
  # bundle, not the CI placeholders above), a Docker image pushed to
  # GHCR, and a deploy to the droplet -- no local machine involved.
  #
  # No approval gate here on purpose, unlike the backend's migrations: a
  # bad frontend deploy is a `docker compose up -d` away from being
  # undone by re-running the previous successful workflow, and NEXT_PUBLIC_*
  # values are not secrets -- they already ship to every visitor's browser
  # today. A schema change on real payment and credit rows is not in the
  # same class of mistake, which is why that gate exists on the backend
  # side and not here.
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # Same build the Dockerfile.prebuilt image has always shipped:
      # standalone output built here, copied verbatim into the image next.
      - run: npx next build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          push: true
          tags: |
            ghcr.io/reservaste/frontend:latest
            ghcr.io/reservaste/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the deploy key into an SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Trust the droplet's host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      # Pulls the image this same job just pushed and retags it to the
      # name docker-compose.yml already expects -- the exact same
      # "load an image, then compose up" shape the manual deploy used all
      # session, just from the registry instead of an scp'd tarball. The
      # compose file itself needs no change: it never rebuilds an image
      # that's already present under that tag.
      - name: Deploy to the droplet
        run: |
          ssh root@${{ secrets.DROPLET_HOST }} '
            set -e
            docker pull ghcr.io/reservaste/frontend:latest
            docker tag ghcr.io/reservaste/frontend:latest reservaste-app:latest
            cd /srv/reservaste/deploy
            docker compose up -d
            for i in 1 2 3 4 5 6 7 8; do
              status=$(docker inspect -f "{{.State.Health.Status}}" deploy-app-1 2>/dev/null || echo starting)
              echo "intento $i: $status"
              [ "$status" = "healthy" ] && exit 0
              sleep 5
            done
            echo "El contenedor no llego a healthy a tiempo -- revisar logs en el droplet"
            exit 1
          '
